<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect your agent: demo</title>
    <script type="module" src="/src/connect-agent.mjs"></script>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #f4f1ff; color: #1f1835; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 32px)); padding: clamp(32px, 8vw, 72px); border-radius: 28px; background: color-mix(in srgb, Canvas 94%, transparent); box-shadow: 0 24px 80px rgba(48, 36, 98, .14); }
      .eyebrow { color: #6d5ce7; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font-size: clamp(38px, 9vw, 72px); line-height: .96; letter-spacing: -.055em; }
      p { max-width: 54ch; color: color-mix(in srgb, currentColor 72%, transparent); font-size: clamp(16px, 2.6vw, 19px); line-height: 1.6; }
      connect-agent { margin-top: 18px; }
      @media (prefers-color-scheme: dark) { :root { background: #120f1c; color: #f5f1ff; } main { box-shadow: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">A handoff, not a sign-in</div>
      <h1>Bring your own agent.</h1>
      <p>Choose the AI you already use. We will open it with a ready-to-go prompt for explaining this page—no account connection or API key required.</p>
      <connect-agent prompt="Explain how the Connect your agent component works and summarize this page."></connect-agent>
    </main>
  </body>
</html>
